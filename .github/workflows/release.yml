name: Publish to PyPI and GitHub Releases

on:
  push:
    tags:
      - 'v*'  # Trigger workflow on version tags like v1.2.3

jobs:
  build-and-publish:
    name: Test, Build, and Publish
    runs-on: ubuntu-latest

    permissions:
      id-token: write  # Needed for publishing
      contents: write  # Needed to create GitHub Releases

    steps:
      # Step 1: Checkout Code
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 2: Set up Python and uv
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      # Step 3: Install project and development dependencies
      - name: Install Dependencies
        run: uv sync --extra dev

      # Step 4: Run Unit Tests
      - name: Run Unit Tests
        run: uv run pytest --junitxml=pytest-results.xml

      # Step 5: Build the Package
      - name: Build the Package
        run: uv build

      # Step 6: Publish to PyPI
      - name: Publish to PyPI
        env:
          PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          uvx twine upload --non-interactive --disable-progress-bar \
            -u __token__ -p "${PYPI_API_TOKEN}" dist/*

      # Step 7: Extract Tag Version
      - name: Extract Tag Version
        id: get_version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_ENV

      # Step 8: Extract Changelog for the Version
      # Step 9: Create GitHub Release
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref }}
          name: Release v${{ env.version }}
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/*.whl
